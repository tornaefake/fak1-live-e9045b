name: gitleaks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gitleaks:
    runs-on: [self-hosted, Linux, X64, ci]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          set -e
          if ! command -v gitleaks >/dev/null 2>&1; then
            curl -fsSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
            tar xzf gitleaks.tgz gitleaks
            ./gitleaks detect --source . --redact -v
          else
            gitleaks detect --source . --redact -v
          fi
